name: Bug report
description: Report a reproducible plugin defect with synthetic data.
body:
  - type: markdown
    attributes:
      value: Never include orders, personal data, Shopware credentials or GOVP tokens.
  - type: input
    id: version
    attributes:
      label: Shopware and plugin versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
    validations:
      required: true
